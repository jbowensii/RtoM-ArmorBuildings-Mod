[project]
name = "rtom-armor-buildings-mod"
version = "3.1.1"
description = "GUI tooling for the Return to Moria Armor & Buildings Mod"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
]

[project.optional-dependencies]
dev = [
    "pylint>=4.0",
    "pytest>=9.0",
]
build = [
    "pyinstaller>=6.0",
]

[tool.pylint.main]
# Only lint the src package and tests — skip legacy wrappers and data dirs
source-roots = ["."]

[tool.pylint."messages control"]
disable = [
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "R0801",  # duplicate-code
    "E0611",  # no-name-in-module (PySide6 false positives)
    "R0903",  # too-few-public-methods (QWidget subclasses)
    "C0415",  # import-outside-toplevel (intentional lazy loading)
    "R0902",  # too-many-instance-attributes (GUI classes need many widgets)
    "R0913",  # too-many-arguments (template/config builders)
    "R0917",  # too-many-positional-arguments
    "R0914",  # too-many-local-variables (UI setup methods)
]

[tool.pylint.format]
max-line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
