# ═══════════════════════════════════════════════════════════════════
# Extraction Manifest — files to extract from the game via retoc + UAssetGUI
#
# Each section defines one DataTable to extract. Fields:
#   stem              — file stem passed to retoc --filter
#   game_path         — relative path within retoc output (no extension)
#   shell_group       — (optional) generate a shell in data/shells/{group}/
#   has_imports       — (optional) shell generation handles import stripping
#   update_mods_group — (optional) copy vanilla JSON to Saves/UpdateMods/{group}/
# ═══════════════════════════════════════════════════════════════════

[DEFAULT]
ue_version = VER_UE4_27
retoc_version = UE4_27

# ── Construction pipeline ────────────────────────────────────────

[DT_Constructions]
stem = DT_Constructions
game_path = Moria/Content/Tech/Data/Building/DT_Constructions
shell_group = MoreBuildings
has_imports = true
update_mods_group = MoreBuildings

[DT_ConstructionRecipes]
stem = DT_ConstructionRecipes
game_path = Moria/Content/Tech/Data/Building/DT_ConstructionRecipes
shell_group = MoreBuildings
update_mods_group = MoreBuildings

# ── Armor / Item pipeline ───────────────────────────────────────

[DT_ItemRecipes]
stem = DT_ItemRecipes
game_path = Moria/Content/Tech/Data/Items/DT_ItemRecipes
shell_group = MoreArmor
update_mods_group = MoreArmor

[DT_Armor]
stem = DT_Armor
game_path = Moria/Content/Tech/Data/Items/DT_Armor

[DT_Weapons]
stem = DT_Weapons
game_path = Moria/Content/Tech/Data/Items/DT_Weapons

[DT_Items]
stem = DT_Items
game_path = Moria/Content/Tech/Data/Items/DT_Items

[DT_Consumables]
stem = DT_Consumables
game_path = Moria/Content/Tech/Data/Items/DT_Consumables

[DT_Ores]
stem = DT_Ores
game_path = Moria/Content/Tech/Data/Items/DT_Ores

[DT_Tools]
stem = DT_Tools
game_path = Moria/Content/Tech/Data/Items/DT_Tools

# ── Reference data ──────────────────────────────────────────────

[DT_CategoryTags]
stem = DT_CategoryTags
game_path = Moria/Content/Tech/Data/DT_CategoryTags

[DT_Loot]
stem = DT_Loot
game_path = Moria/Content/Character/AI/DT_Loot
